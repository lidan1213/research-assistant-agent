[project]
name = "research-assistant-agent"
version = "0.1.0"
description = "A FastAPI-based research assistant agent framework (ReAct + RAG + tool-calling)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.30",
    "sse-starlette>=2.1",
    "aiofiles>=23.2",
    "python-multipart>=0.0.9",
    "tenacity>=8.2",
    "loguru>=0.7",
    "redis>=5.0",
    "numpy>=1.26",
    "arxiv>=2.1",
    "pypdf>=4.0",
    "PyPDF2>=3.0",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]
local-embedding = [
    "faiss-cpu>=1.8",
    "sentence-transformers>=2.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = ".test-cache"
# 默认排除依赖外部网络的测试（arxiv 限流窗口不稳定，避免全量卡住）与
# 依赖 ChromaDB 服务端的集成测试；需要时显式运行：pytest -m network / -m chroma
addopts = "-p no:cacheprovider -m 'not network and not chroma'"
markers = [
    "network: 需要访问外部网络（如 arxiv.org），默认从全量测试中排除",
    "chroma: 需要本地 ChromaDB 服务端（127.0.0.1:8001），默认从全量测试中排除",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
