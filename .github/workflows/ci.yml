name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies (lightweight subset)
        run: |
          python -m pip install --upgrade pip
          # 说明：完整 requirements.txt 含 sentence-transformers / torch，
          # 体积大、安装慢，CI 仅安装运行 pytest 所需的轻量子集即可覆盖
          # 业务代码与导入；若后续测试需要语义嵌入，可在此追加 sentence-transformers。
          pip install --no-cache-dir \
            fastapi uvicorn pydantic pydantic-settings sse-starlette \
            httpx openai tenacity loguru numpy arxiv PyPDF2 redis \
            pytest pytest-asyncio faiss-cpu langchain-core langchain-openai \
            langgraph rank_bm25

      - name: Prepare .env for tests
        # 应用通过 pydantic-settings 读取 .env；无 .env 时回退默认值，
        # 复制 .env.example 保证配置可加载，与本地开发一致。
        run: cp .env.example .env

      - name: Run pytest
        # 包含检索质量回归门禁（recall@5 阈值）与 ReAct 行为一致性测试，
        # 检索/图编排逻辑退化会被自动拦截。
        run: pytest -q
